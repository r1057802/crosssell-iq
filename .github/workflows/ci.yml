name: CI

on:
  push:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore CrossSellIQ.slnx

      - name: Build .NET solution
        run: dotnet build CrossSellIQ.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test CrossSellIQ.slnx --configuration Release --no-build

      - name: Build API image
        run: docker build --file Dockerfile --tag crossselliq-api:ci .

      - name: Build pipeline image
        run: docker build --file Dockerfile.pipeline --tag crossselliq-pipeline:ci .
    
  publish-image:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/crossselliq-api
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build API image
        run: docker build --file Dockerfile --tag "$IMAGE:${{ github.sha }}" --tag "$IMAGE:latest" .

      - name: Push API image
        run: docker push --all-tags "$IMAGE"

  deploy:
    needs: publish-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Azure Container Apps
        run: |
          az containerapp update \
            --name crossselliq \
            --resource-group rg-crossselliq \
            --image ghcr.io/${{ github.repository_owner }}/crossselliq-api:${{ github.sha }}

      - name: Check that the deployed app is healthy
        run: |
          APP_HOST=$(az containerapp show --name crossselliq --resource-group rg-crossselliq --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "https://$APP_HOST/health"


